services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: overtime_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/demo_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d overtime_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:devpassword@postgres:5432/overtime_dev
      PGSSL: disable
      DEMO_MODE: "1"
      SERVE_FRONTEND: "1"
      JWT_SECRET: local-dev-jwt-secret-change-before-production
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  pgdata:
