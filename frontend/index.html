<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Masuk — Sistem Lembur Cimory</title>
<link rel="icon" type="image/png" href="logo-cimory.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/ui.js"></script>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-6">

<div class="flex-1 flex items-center justify-center py-8">
  <main class="w-full max-w-[400px]">
    <div class="flex items-center gap-3.5 mb-6">
      <img src="logo-cimory.png" alt="Cimory" class="h-11 w-auto object-contain">
      <div class="border-l border-slate-300 pl-3.5">
        <h1 class="text-base font-bold text-slate-900 leading-tight">Sistem Monitoring Lembur</h1>
        <p class="text-xs text-slate-500 mt-0.5">Portal internal karyawan &amp; persetujuan</p>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 md:p-7">
      <h2 class="text-lg font-bold text-slate-900">Masuk ke akun</h2>
      <p class="text-xs text-slate-500 mt-1 mb-5">Gunakan alamat email kantor yang terdaftar.</p>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label for="email" class="block text-xs font-semibold text-slate-700 mb-1.5">Email kantor</label>
          <input type="email" id="email" required autocomplete="email"
            class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm bg-white focus:border-brand-600 focus:ring-2 focus:ring-brand-600/15 focus:outline-none transition"
            placeholder="nama@cimory.com">
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">Kata sandi</label>
          <div class="relative">
            <input type="password" id="password" required autocomplete="current-password"
              class="w-full pl-3.5 pr-10 py-2.5 border border-slate-300 rounded-xl text-sm bg-white focus:border-brand-600 focus:ring-2 focus:ring-brand-600/15 focus:outline-none transition"
              placeholder="Masukkan kata sandi">
            <button type="button" id="togglePwd" onclick="togglePassword()" aria-label="Tampilkan kata sandi"
              class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 text-slate-400 hover:text-slate-700 rounded-lg transition">
              <span data-icon="eye"></span>
            </button>
          </div>
        </div>

        <div id="errorMsg" role="alert" class="hidden note tone-bad">
          <p class="text-xs font-medium" id="errorText"></p>
        </div>

        <div id="loadingMsg" role="status" class="hidden note tone-info">
          <p class="text-xs font-medium">Server sedang aktif kembali dari mode siaga. Mohon tunggu sekitar 30 detik…</p>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
          Masuk
        </button>
      </form>

      <div class="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
        <span>Kendala akses akun?</span>
        <a href="mailto:hrdcimory1@gmail.com" class="font-semibold text-brand-600 hover:text-brand-800">hrdcimory1@gmail.com</a>
      </div>
    </div>
  </main>
</div>

<footer class="text-center text-xs text-slate-400 py-2">
  Sistem Monitoring Lembur · PT Cisarua Mountain Dairy
</footer>

<script>
const API_URL = location.hostname.endsWith('.onrender.com') ? location.origin : 'https://overtime-backend-wd4c.onrender.com';

fetch(`${API_URL}/health`).catch(() => {});

function togglePassword() {
  const inp = document.getElementById('password');
  const btn = document.getElementById('togglePwd');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
  btn.innerHTML = UI.icon(show ? 'eyeOff' : 'eye');
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const errBox = document.getElementById('errorMsg');
  const errText = document.getElementById('errorText');
  const loadBox = document.getElementById('loadingMsg');

  errBox.classList.add('hidden');
  loadBox.classList.add('hidden');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span><span>Memverifikasi…</span>';

  const slowTimer = setTimeout(() => {
    loadBox.classList.remove('hidden');
  }, 3000);

  try {
    const res = await fetch(`${API_URL}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    clearTimeout(slowTimer);
    loadBox.classList.add('hidden');

    const data = await res.json();

    if (!res.ok) {
      errText.textContent = data.error || 'Login gagal. Periksa kembali email dan kata sandi.';
      errBox.classList.remove('hidden');
      return;
    }

    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));

    if (data.user.role === 'admin') window.location.href = 'admin.html';
    else if (data.user.role === 'manager') window.location.href = 'manager.html';
    else if (data.user.role === 'reviewer') window.location.href = 'reviewer.html';
    else window.location.href = 'employee.html';
  } catch (err) {
    clearTimeout(slowTimer);
    loadBox.classList.add('hidden');
    errText.textContent = 'Tidak dapat terhubung ke server. Tunggu sekitar 30 detik lalu coba lagi.';
    errBox.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Masuk';
  }
}

const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('user') || 'null');
if (token && user) {
  if (user.role === 'admin') window.location.href = 'admin.html';
  else if (user.role === 'manager') window.location.href = 'manager.html';
  else if (user.role === 'reviewer') window.location.href = 'reviewer.html';
  else window.location.href = 'employee.html';
}
</script>
<script src="demo-banner.js" defer></script>
</body>
</html>
